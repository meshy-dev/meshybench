[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshybench"
version = "1.0.0"
description = "Benchmarks for image-to-3D generation: geometry alignment, texture alignment, mesh details."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["3d", "evaluation", "metric", "image-to-3d", "benchmark", "geometry", "texture", "detail"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "trimesh>=4.0",
  "Pillow>=10",
  "scikit-image>=0.22",
  "torch>=2.1",
  "transformers>=4.40",
]
# nvdiffrast is installed from its GitHub repository (github.com/NVlabs/nvdiffrast); it is not on PyPI.

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
